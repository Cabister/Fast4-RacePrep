    </head>
    <body>
        <header>
            <div class="divHeader">
            <img src="img/images.png" class="logo"/>
            <!--Barra de navegação-->
            <nav>
                <!--Lista de itens do menu-->

            </div>
        </header>

        <main>

            <ul class="contatos-titulo">
                <li class="contatos-item">Contatos</li>
            </ul>

            <div id="formulario">
                <p class="texto-contatos">
                    Será uma alegria te atender!
                    <br><br>
                    Você pode nos encontrar no instagram, no WhatsApp ou preencher o formulario abaixo.
                </p>
                <form id="frmContato">
                    <fieldset>
                        <legend>Dados Pessoais</legend>
                        <label>* Nome e sobrenome</label>
                            <input type="text" id="nomesobrenome" name="" class="input-padrao" required>
                        <label>E-mail</label>
                            <input type="email" id="email" name="" class="input-padrao" placeholder="seuemail@dominio.com">
                        <label>Telefone</label>
                            <input type="tel" id="telefone" name="" class="input-padrao" placeholder="(XX) XXXXX-XXXX">
                        <label>* Mensagem</label>
                            <textarea cols="70" rows="10" id="mensagem" name="" class="input-padrao" required></textarea>


                        <label>Como prefere o nosso contato?
                            <input type="radio" value="radio-email" name="Contato"> E-mail
                            <input type="radio" value="radio-telefone" name="Contato"> Telefone
                            <input type="radio" value="radio-whatsapp" name="Contato"> WhatsApp
                        </label> 
                        
                        <br>
                        <label>Qual o motivo do seu contato?
                            <select>
                                <option>Selecione</option>
                                <option>Dúvida</option>
                                <option>Sugestão</option>
                                <option>Elogio</option>
                                <option>Reclamação</option>
                            </select>
                        </label>
                        <br>
                    </fieldset>

                    <label><input type="checkbox" class="chk"> Gostaria de receber nossas novidades por e-mail?</label>
                    <input type="submit" id="enviar" value="Enviar formulário" class="enviar">
                </form>
            </div>

        </main>

        <footer >
            <section class="um">
                <img class="imgf" src="img/images.png"/>

                <div class="divinsta">

                </div>
            </section>
            <section class="tres">
                <img  class="email" src="img/gmail.png"/>
                <div class="divemail">
                    <p class="emailtx">fast4@gmail.com</p>
                </div>
            </section>
            
        </footer>
